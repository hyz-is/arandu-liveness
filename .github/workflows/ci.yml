name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

# The ONNX Runtime binding arandu-onnx links is cgo.
env:
  CGO_ENABLED: "1"

# go.mod resolves github.com/hyz-is/arandu-onnx and github.com/hyz-is/arandu-face
# from ../arandu-onnx and ../arandu-face until those modules are tagged, so the
# three repositories are checked out side by side and every step runs in this
# one. The sibling checkouts and the replaces go together.
defaults:
  run:
    working-directory: arandu-liveness

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: arandu-liveness
          # API compatibility is measured against the latest immutable tag.
          fetch-depth: 0

      - uses: actions/checkout@v7
        with:
          repository: hyz-is/arandu-onnx
          path: arandu-onnx

      - uses: actions/checkout@v7
        with:
          repository: hyz-is/arandu-face
          path: arandu-face

      - uses: actions/setup-go@v7
        with:
          # Not go-version-file: go.mod declares the MINIMUM language version,
          # and setup-go would install exactly that -- a patch release whose
          # standard library carries fixed vulnerabilities. "stable" is the
          # version people actually run, which is what CI should test against.
          go-version: stable
          cache-dependency-path: arandu-liveness/go.sum

      # The pipeline tests load ONNX Runtime and skip without it, which would
      # leave the pipeline untested. The library goes where the Linux default,
      # the loader's own search path, finds it.
      - name: install ONNX Runtime
        run: |
          set -euo pipefail
          version=1.27.1
          curl -fsSL "https://github.com/microsoft/onnxruntime/releases/download/v${version}/onnxruntime-linux-x64-${version}.tgz" \
            | tar -xz -C "$RUNNER_TEMP"
          sudo cp -P "$RUNNER_TEMP/onnxruntime-linux-x64-${version}/lib/"libonnxruntime*.so* /usr/local/lib/
          sudo ldconfig

      # The models are not in the repository. The download commands fetch
      # them from the sources the manifests pin and verify every digest: the
      # PAD models from this repository, and YuNet, which the composition test
      # detects with, from arandu-face. The tests then read them from
      # KUAA_MODELS_DIR and never download.
      - name: fetch the models
        run: |
          set -euo pipefail
          GOWORK=off go run ./cmd/liveness-models -dir "$RUNNER_TEMP/models"
          (cd ../arandu-face && GOWORK=off go run ./cmd/face-models -dir "$RUNNER_TEMP/models" -only yunet_2026may)
          echo "KUAA_MODELS_DIR=$RUNNER_TEMP/models" >> "$GITHUB_ENV"

      - name: gofmt
        # Two filters, and neither is preference. gofmt is the only tool in the
        # chain that ignores build tags, so it reads files the compiler
        # deliberately excludes; testdata/ holds fixtures that are invalid on
        # purpose. `go build`, `go vet` and `go test` skip both on their own.
        run: |
          unformatted=$(find . -name '*.go' -not -path '*/testdata/*' \
                          -not -name '*.kyse.go' -exec gofmt -l {} +)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race ./...

      # A v0 release may break, but every break must tell an installer exactly
      # what to replace. Module mode also sees a deleted package or type that a
      # loop over the current package list would miss.
      - name: api diff against the last release
        run: |
          set -euo pipefail
          modpath=$(GOWORK=off go list -m -f '{{.Path}}')
          latest=""
          while IFS= read -r tag; do
            tagged_module=$(git show "${tag}:go.mod" | sed -n 's/^module //p')
            if [ "$tagged_module" = "$modpath" ]; then
              latest="$tag"
              break
            fi
          done < <(git tag --list 'v*' --sort=-v:refname)
          if [ -z "$latest" ]; then
            echo "no release to compare against yet"
            exit 0
          fi
          echo "comparing the working tree against $latest"

          # The old tree is checked out beside this one so that its own
          # replaces of ../arandu-onnx and ../arandu-face still resolve.
          tmp=$(mktemp -d -p "$GITHUB_WORKSPACE")
          old="$tmp/last-release"
          git worktree add -q --detach "$old" "$latest"
          (cd "$old" && GOWORK=off go run golang.org/x/exp/cmd/apidiff@latest -m -w "$tmp/api.out" "$modpath")
          git worktree remove --force "$old"

          GOWORK=off go run golang.org/x/exp/cmd/apidiff@latest -m -incompatible "$tmp/api.out" "$modpath" > "$tmp/diff.out"
          broke=$(grep '^- ' "$tmp/diff.out" || true)
          if [ -z "$broke" ]; then
            echo "no incompatible change since $latest"
            exit 0
          fi
          while IFS= read -r line; do
            printf '    %s\n' "$line"
          done <<< "$broke"

          if git diff --quiet "$latest" -- UPGRADE.md; then
            echo
            echo "there are incompatible changes and UPGRADE.md was not touched since $latest."
            exit 1
          fi

          added=$(git diff "$latest" -- UPGRADE.md | grep '^+' || true)
          missing=0
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            symbol=${line#- }
            symbol=${symbol#package }
            symbol=${symbol#./}
            symbol=${symbol%%:*}
            [ -n "$symbol" ] || continue
            if ! printf '%s' "$added" | grep -qF -- "$symbol"; then
              echo "UPGRADE.md does not name $symbol"
              missing=1
            fi
          done <<< "$broke"
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "every incompatible change is named in UPGRADE.md"

      # A known vulnerability blocks the merge rather than showing up in a
      # report nobody reads.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
